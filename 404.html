<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    color: #2c3e50;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 500px;
  }
  h1 {
    font-size: 6rem;
    color: #34495e;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  h2 {
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: #2c3e50;
  }
  p {
    font-size: 1rem;
    color: #7f8c8d;
    line-height: 1.6;
    margin-bottom: 25px;
  }
  a.home-link {
    display: inline-block;
    padding: 12px 28px;
    background: #34495e;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: background 0.2s ease;
  }
  a.home-link:hover {
    background: #2c3e50;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for isn't available right now. We're currently making some updates behind the scenes.</p>
    
  </div>
</body>
</html>
